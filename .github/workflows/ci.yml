name: CI

# works localy, now i will test globaly to see where it fails
on: push

jobs:
  test:
    runs-on: ubuntu-latest

    name: test different python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

        name: Setup cache
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

          cache: "pip"

          cache-dependency-path: "pyproject.toml"

      - run: python -m pip install -e .

      - run: python -m pip install pytest

      - run: python -m pytest tests/test_data.py tests/test_features.py tests/test_model.py -v

  train:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: python -m pip install -e .
      - run: python -m churn.model

      - uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m churn.evaluate

      - name: Skriv mätvärden i Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import outputs
          from pathlib import Path 

          path = Path("outputs/matvarden.json")
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                summary.write("## Modellutvärdering\n\n")
                summary.write(f"Commit: `{os.environ['GITHUB_SHA']}`\n\n")

                if path.exists():
                    data = json.loads(path.read_text(encoding="utf-8"))
                    summary.write("| Mätvärde | Värde |\n")
                    summary.write("|---|---|\n")
                    for key, value in data.items():
                        summary.write(f"| {key} | {value} |\n")
                else:
                    summary.write("Mätvärdesfilen saknas.\n")
            PY
