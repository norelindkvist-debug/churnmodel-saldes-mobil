name: CI

on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - ".github/actions/**"

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test different python versions (${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
          install-pytest: "true"

      - name: Run tests
        run: |
          python -m pytest tests/test_data.py tests/test_features.py tests/test_model.py -v

  train:
    name: train
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: Train model
        run: python -m churn.model

      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    name: utvardera
    runs-on: ubuntu-latest
    needs: train

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: Download model artifact
        uses: actions/download-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Evaluate model
        run: python -m churn.evaluate

      - name: Write metrics to Summary
        if: always()
        shell: bash
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Modellens mätvärden" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mätvärdesfilen saknas." >> "$GITHUB_STEP_SUMMARY"
          fi

  ringlista:
    name: Skapa ringlista
    runs-on: ubuntu-latest
    needs: utvardera

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Generate call list
        run: python -m churn.score

      - name: Upload call list
        uses: actions/upload-artifact@v7
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error
