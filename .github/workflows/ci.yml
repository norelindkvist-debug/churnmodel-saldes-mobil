name: CI

# works localy, now i will test globaly to see where it fails
on:
  push:
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    name: test different python versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

        name: Setup cache
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

          cache: "pip"

          cache-dependency-path: "pyproject.toml"

      - run: python -m pip install -e .

      - run: python -m pip install pytest

      - run: python -m pytest tests/test_data.py tests/test_features.py tests/test_model.py -v

  train:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - run: python -m pip install -e .
      - run: python -m churn.model

      - uses: actions/upload-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  utvardera:
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Installera projektet
        run: |
          python -m pip install -e .

      - uses: actions/download-artifact@v7
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - name: Utvärdera modellen
        run: python -m churn.evaluate

      - name: Skriv mätvärden i Summary
        if: always()
        shell: bash
        run: |
          if [ -f outputs/matvarden.json ]; then
            echo "## Modellens mätvärden" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/matvarden.json >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mätvärdesfilen saknas." >> "$GITHUB_STEP_SUMMARY"
          fi
