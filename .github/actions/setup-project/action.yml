name: Setup Python Project
description: Installera Python och projektets beroenden

inputs:
  python-version:
    description: Python-version att använda
    required: true

  install-pytest:
    description: Installera pytest för tester
    required: false
    default: "false"

runs:
  using: composite

  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Installera projektet
      shell: bash
      run: python -m pip install -e .

    - name: Installera pytest
      if: inputs.install-pytest == 'true'
      shell: bash
      run: python -m pip install pytest
